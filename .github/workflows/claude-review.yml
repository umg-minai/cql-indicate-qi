name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: read

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.sender.type == 'User' &&
      (
        github.event_name == 'pull_request' ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request &&
          startsWith(github.event.comment.body, '@claude review') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Resolve pull request
        id: pr
        uses: actions/github-script@v8
        with:
          script: |
            const number = context.payload.pull_request?.number ?? context.issue.number;
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: number
            });
            const sameRepo = pr.head.repo?.full_name ===
              context.repo.owner + '/' + context.repo.repo;
            core.setOutput('run', pr.state === 'open' && !pr.draft && sameRepo);
            core.setOutput('number', pr.number);
            core.setOutput('head_sha', pr.head.sha);

      - uses: actions/checkout@v6
        if: steps.pr.outputs.run == 'true'
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Review with Claude Opus
        if: steps.pr.outputs.run == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review PR ${{ github.repository }}/pull/${{ steps.pr.outputs.number }}.
            Head commit to review: ${{ steps.pr.outputs.head_sha }}.

            Follow the PR review instructions in CLAUDE.md.
            The local checkout is the proposed PR head revision.
            Use gh pr diff and gh pr view to inspect the proposed changes,
            commit messages, linked requirements, and previous reviews.
            Use gh issue view --comments for issues in this repository.

            Read referenced public issues, issue comments, PRs, and files
            from umg-minai/indicate-qi-definitions or umg-minai/cql-indicate-qi
            with WebFetch. Prefer api.github.com for issue data and
            raw.githubusercontent.com for files at exact commit SHAs.
            If a source cannot be retrieved or its revision is ambiguous,
            report that limitation rather than assuming compliance.

            Review this revision even if an earlier review exists.
            Avoid repeating unchanged findings.
            Post actionable findings with
            mcp__github_inline_comment__create_inline_comment.
            Post a short summary using gh pr comment, naming the reviewed
            commit, source revisions, and any verification limitations.
            If no issues are found, state that briefly.

            Do not modify files, push commits, approve, or merge the PR.
          claude_args: |
            --model opus
            --max-turns 20
            --allowedTools "Read,Glob,Grep,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh issue view:*),WebFetch(domain:github.com),WebFetch(domain:api.github.com),WebFetch(domain:raw.githubusercontent.com),mcp__github_inline_comment__create_inline_comment"
