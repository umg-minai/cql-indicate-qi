mappings:
  - name:        InsulinDrugs
    category:    Medications
    subcategory: "Other drugs"

  - name:        AnticoagulationDrugs
    category:    Medications
    subcategory: "Anticoagulants"

  - name:         GlucoseMeasurements
    concept_sets: ["Glucose in blood"]
    exclude:
      - concept_id: 40757626
        name:       "Glucose [Moles/volume] in Serum or Plasma --post dialysis"
      - concept_id: 46235168
        name:       "Fasting glucose [Moles/volume] in Blood"
      - concept_id: 46236950
        name:       "Fasting glucose [Moles/volume] in Serum, Plasma or Blood"

  - name:         PhosphateMeasurements
    concept_sets: ["Phosphate in blood"]
    exclude:
      - concept_id: 3050450
        name:       "Phosphate [Mass/volume] in Serum or Plasma --post dialysis"
      - concept_id: 3049552
        name:       "Phosphate [Mass/volume] in Serum or Plasma --pre dialysis"
      - concept_id: 40759093
        name:       "Phosphate [Moles/volume] in Serum or Plasma --post dialysis"

  - name:         ConsultationWithPatient
    concept_sets: ["Consultation with patient"]
    include:
      - concept_id: 4247376
        name:       "Discussion about care plan with family"

  - name:         PaO2Measurements
    concept_sets: ["Oxygen partial pressure in arterial blood"]
    priorities:
      - concept_id: 3027801
        name:       "Oxygen [Partial pressure] in Arterial blood"
        priority:   1
      - concept_id: 3022803
        name:       "Oxygen [Partial pressure] adjusted to patient's actual temperature in Arterial blood"
        priority:   2

  # Concept set "Tidal volume (Vt)" which indicates measurements with
  # unit mL.  Don't include "Tidal volume per body weight (Vt/kg)"
  # since that concept set uses the unit mL/kg.
  - name:         TidalVolumeMeasurements
    concept_sets: ["Tidal volume (Vt)"]
    priorities:
      - concept_id: 44782826
        name:       "Inspiratory tidal volume"
        priority:   1
      - concept_id: 4108448
        name:       "Spontaneous tidal volume"
        priority:   2
      - concept_id: 3012410
        name:       "Tidal volume setting Ventilator"
        priority:   3
      - concept_id: 4029625
        name:       "Tidal volume"
        priority:   4

  - name:         BodyHeight
    concept_sets: ["Body height"]
    only:
      - concept_id: 3036277
        name:       "Body height"

  - name:         MobilizationProcedures
    concept_sets: ["Mobilization"]

  - name:         IdealBodyWeight
    concept_sets: ["Ideal body weight"]

  - name:         PEEPMeasurements
    concept_sets: ["Applied Positive End-Expiratory Pressure (PEEP)"]

  - name:         Extubation
    concept_sets: ["Extubation"]

  - name:         EndotrachealTube
    concept_sets: ["Endotracheal tube"]

  - name:         InvasiveMechanicalVentilation
    concept_sets: ["Invasive mechanical ventilation"]

  - name:         TrialOfSpontaneousBreathing
    concept_sets: ["Trial of spontaneous breathing"]

  - name:         RenalReplacementTherapyProcedures
    concept_sets: ["Renal replacement therapy (RRT)"]
