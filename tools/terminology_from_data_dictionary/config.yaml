# Exceptions to the concept sets of the data dictionary.
#
# Concept sets are referenced by their exact name in indicate-eu/data-dictionary,
# for example <!-- inject:Body height|Tidal volume (Vt) --> in a markdown file.
# An entry is only needed if a concept set has exceptions
# (include, exclude, only, priorities).
mappings:
  # Category entries: all concept sets of a category (the name is just a label)
  - name:        InsulinDrugs
    category:    Medications
    subcategory: "Other drugs"

  - name:        AnticoagulationDrugs
    category:    Medications
    subcategory: "Anticoagulants"

  - name:         "Glucose in blood"
    exclude:
      - concept_id: 40757626
        name:       "Glucose [Moles/volume] in Serum or Plasma --post dialysis"
      - concept_id: 46235168
        name:       "Fasting glucose [Moles/volume] in Blood"
      - concept_id: 46236950
        name:       "Fasting glucose [Moles/volume] in Serum, Plasma or Blood"

  - name:         "Phosphate in blood"
    exclude:
      - concept_id: 3050450
        name:       "Phosphate [Mass/volume] in Serum or Plasma --post dialysis"
      - concept_id: 3049552
        name:       "Phosphate [Mass/volume] in Serum or Plasma --pre dialysis"
      - concept_id: 40759093
        name:       "Phosphate [Moles/volume] in Serum or Plasma --post dialysis"

  - name:         "Consultation with patient"
    include:
      - concept_id: 4247376
        name:       "Discussion about care plan with family"
        omop_record: "Observation"

  - name:         "Oxygen partial pressure in arterial blood"
    concepts:
      - concept_id: 3027801
        name:       "Oxygen [Partial pressure] in Arterial blood"
        priority:   1
      - concept_id: 3022803
        name:       "Oxygen [Partial pressure] adjusted to patient's actual temperature in Arterial blood"
        priority:   2

  # "Tidal volume (Vt)" is measured in mL. "Tidal volume per body weight (Vt/kg)"
  # is a different concept set (unit mL/kg) and is not used here.
  - name:         "Tidal volume (Vt)"
    concepts:
      - concept_id: 44782826
        name:       "Inspiratory tidal volume"
        priority:   1
        redundancy_group: "Tidal volume inspired"
        is_preferred:     false
      - concept_id: 4108448
        name:       "Spontaneous tidal volume"
        priority:   2
      - concept_id: 3012410
        name:       "Tidal volume setting Ventilator"
        priority:   3
      - concept_id: 4029625
        name:       "Tidal volume"
        priority:   4
      - concept_id: 36303816
        name:       "Tidal volume.inspired"
        redundancy_group: "Tidal volume inspired"
        is_preferred:     true

  - name:         "Body weight"
    concepts:
      - concept_id:       3025315
        name:             "Body weight"
        redundancy_group: "Body weight"
        is_preferred:     true
      - concept_id:       3013762
        name:             "Body weight Measured"
        redundancy_group: "Body weight"
        is_preferred:     true
      - concept_id:       3013853
        name:             "Body weight Measured --ante partum"
        redundancy_group: "Body weight"
        is_preferred:     true
      - concept_id:       3009617
        name:             "Body weight Measured --post dialysis"
        redundancy_group: "Body weight"
        is_preferred:     true
      - concept_id:       3010147
        name:             "Body weight Measured --post partum"
        redundancy_group: "Body weight"
        is_preferred:     true
      - concept_id:       3015644
        name:             "Body weight Measured --postoperative"
        redundancy_group: "Body weight"
        is_preferred:     true
      - concept_id:       3019336
        name:             "Body weight Measured --pre dialysis"
        redundancy_group: "Body weight"
        is_preferred:     true
      - concept_id:       3005422
        name:             "Body weight Measured --preoperative"
        redundancy_group: "Body weight"
        is_preferred:     true
      - concept_id:       40761330
        name:             "Body weight Measured --when specimen taken"
        redundancy_group: "Body weight"
        is_preferred:     true
      - concept_id:       3010220
        name:             "Body weight Measured --with clothes"
        redundancy_group: "Body weight"
        is_preferred:     true
      - concept_id:       3011054
        name:             "Body weight Measured --without clothes"
        redundancy_group: "Body weight"
        is_preferred:     true
      - concept_id:       4099154
        name:             "Body weight"
        redundancy_group: "Body weight"
        is_preferred:     false
      - concept_id:       4178502
        name:             "Body weight measure"
        redundancy_group: "Body weight"
        is_preferred:     false
      - concept_id:       4310154
        name:             "Body weight with shoes"
        redundancy_group: "Body weight"
        is_preferred:     false
      - concept_id:       4175354
        name:             "Body weight without shoes"
        redundancy_group: "Body weight"
        is_preferred:     false
      - concept_id:       42536495
        name:             "Current body weight"
        redundancy_group: "Body weight"
        is_preferred:     false
      - concept_id:       37160438
        name:             "Post-amputation measured body weight"
        redundancy_group: "Body weight"
        is_preferred:     false
      - concept_id:       37160443
        name:             "Post-dialysis body weight"
        redundancy_group: "Body weight"
        is_preferred:     false
      - concept_id:       37160447
        name:             "Pre-dialysis body weight"
        redundancy_group: "Body weight"
        is_preferred:     false

  - name:         "Ideal body weight"
    concepts:
      - concept_id:       3032445
        name:             "Ideal body weight"
        redundancy_group: "Ideal Body Weight"
        is_preferred:     true
      - concept_id:       4062985
        name:             "Ideal body weight"
        redundancy_group: "Ideal Body Weight"
        is_preferred:     false

  - name:         "Body height"
    only:
      - concept_id: 3036277
        name:       "Body height"

# Concepts that are in no concept set of the data dictionary (yet).
# The names are the groups of the harmonizer's omop-concepts.csv.
additional_concept_sets:
