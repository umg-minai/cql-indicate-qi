# Exceptions to the concept sets of the data dictionary.
#
# Concept sets are referenced by their exact name in indicate-eu/data-dictionary,
# for example <!-- inject:Body height|Tidal volume (Vt) --> in a markdown file.
# An entry is only needed if a concept set has exceptions
# (include, exclude, only, priorities), or if the QIs do not use it (used: false).
mappings:
  # Category entries: all concept sets of a category (the name is just a label)
  - name:        InsulinDrugs
    category:    Medications
    subcategory: "Other drugs"

  - name:        AnticoagulationDrugs
    category:    Medications
    subcategory: "Anticoagulants"

  - name:         "Glucose in blood"
    exclude:
      - concept_id: 40757626
        name:       "Glucose [Moles/volume] in Serum or Plasma --post dialysis"
      - concept_id: 46235168
        name:       "Fasting glucose [Moles/volume] in Blood"
      - concept_id: 46236950
        name:       "Fasting glucose [Moles/volume] in Serum, Plasma or Blood"

  - name:         "Phosphate in blood"
    exclude:
      - concept_id: 3050450
        name:       "Phosphate [Mass/volume] in Serum or Plasma --post dialysis"
      - concept_id: 3049552
        name:       "Phosphate [Mass/volume] in Serum or Plasma --pre dialysis"
      - concept_id: 40759093
        name:       "Phosphate [Moles/volume] in Serum or Plasma --post dialysis"

  - name:         "Consultation with patient"
    include:
      - concept_id: 4247376
        name:       "Discussion about care plan with family"
        omop_record: "Observation"
        vocabulary: "SNOMED"
    concepts:
      - concept_id:       37164964
        name:             "Consultation with patient"
        redundancy_group: "Consultation with patient"
        is_preferred:     true
      - concept_id:       37168078
        name:             "Face to face consultation with patient"
        redundancy_group: "Consultation with patient"
        is_preferred:     false
      - concept_id:       4089048
        name:             "New patient consultation"
        redundancy_group: "Consultation with patient"
        is_preferred:     false

  - name:         "Oxygen partial pressure in arterial blood"
    concepts:
      - concept_id: 3027801
        name:       "Oxygen [Partial pressure] in Arterial blood"
        priority:   1
      - concept_id: 3022803
        name:       "Oxygen [Partial pressure] adjusted to patient's actual temperature in Arterial blood"
        priority:   2

  # "Tidal volume (Vt)" is measured in mL. "Tidal volume per body weight (Vt/kg)"
  # is a different concept set (unit mL/kg) and is not used here.
  - name:         "Tidal volume (Vt)"
    concepts:
      - concept_id: 44782826
        name:       "Inspiratory tidal volume"
        priority:   1
        redundancy_group: "Tidal volume inspired"
        is_preferred:     false
      - concept_id: 4108448
        name:       "Spontaneous tidal volume"
        priority:   2
      - concept_id: 3012410
        name:       "Tidal volume setting Ventilator"
        priority:   3
      - concept_id: 4029625
        name:       "Tidal volume"
        priority:   4
      - concept_id: 36303816
        name:       "Tidal volume.inspired"
        redundancy_group: "Tidal volume inspired"
        is_preferred:     true

  # Twins: only 3025315 (LOINC) and 4099154 (SNOMED); the other Body weight concepts are different measures.
  - name:         "Body weight"
    concepts:
      - concept_id:       3025315
        name:             "Body weight"
        redundancy_group: "Body weight"
        is_preferred:     true
      - concept_id:       4099154
        name:             "Body weight"
        redundancy_group: "Body weight"
        is_preferred:     false

  - name:         "Ideal body weight"
    concepts:
      - concept_id:       3032445
        name:             "Ideal body weight"
        redundancy_group: "Ideal Body Weight"
        is_preferred:     true
      - concept_id:       4062985
        name:             "Ideal body weight"
        redundancy_group: "Ideal Body Weight"
        is_preferred:     false

  - name:         "Heparin"
    concepts:
      - concept_id:       1367571
        name:             "heparin"
        redundancy_group: "Heparin"
        is_preferred:     true
      - concept_id:       35884360
        name:             "Heparin Sodium"
        redundancy_group: "Heparin"
        is_preferred:     false

  - name:         "Plateau pressure (Pplat)"
    concepts:
      - concept_id:       36304439
        name:             "Pressure.plateau Respiratory system airway"
        redundancy_group: "Plateau pressure"
        is_preferred:     true
      - concept_id:       44782825
        name:             "Airway plateau pressure"
        redundancy_group: "Plateau pressure"
        is_preferred:     false

  - name:         "Body height"
    only:
      - concept_id: 3036277
        name:       "Body height"

  # PEEP (indicate-qi-definitions#29): QI01 uses total and applied PEEP without the dynamic
  # concepts, and not intrinsic PEEP. The priorities run over both concept sets.
  - name:         "Total Positive End-Expiratory Pressure (Total PEEP)"
    exclude:
      - concept_id: 42528517
        name:       "Total dynamic PEEP Respiratory system"
    concepts:
      - concept_id: 42527140
        name:       "Total PEEP Respiratory system"
        priority:   1

  - name:         "Applied Positive End-Expiratory Pressure (PEEP)"
    exclude:
      - concept_id: 42528516
        name:       "Extrinsic dynamic PEEP Respiratory system"
    concepts:
      - concept_id: 42528515
        name:       "Extrinsic PEEP Respiratory system"
        priority:   2
      - concept_id: 3016226
        name:       "PEEP Respiratory system"
        priority:   3
      - concept_id: 21490855
        name:       "PEEP Respiratory system --on ventilator"
        priority:   4
      - concept_id: 3022875
        name:       "Positive end expiratory pressure setting Ventilator"
        priority:   5

  - name:         "Intrinsic Positive End-Expiratory Pressure (auto-PEEP)"
    used:         false

# Concepts that are in no concept set of the data dictionary (yet).
# The names are the groups of the harmonizer's omop-concepts.csv.
additional_concept_sets:
  - name: "Intensive Care Visit"
    omop_record: "VisitOccurrence | VisitDetail"
    concepts:
      - concept_id: 32037
        name:       "Intensive Care"
        vocabulary: "Visit"

  - name: "IBW sex coefficient"
    omop_record: "Person.genderConcept"
    concepts:
      - concept_id: 8532
        name:       "Gender Female"
        vocabulary: "Gender"
      - concept_id: 8507
        name:       "Gender Male"
        vocabulary: "Gender"

  # These ingredients are also in the insulin drug sets on purpose: the CQL needs both, the markdown shows only the drugs.
  - name: "Insulin Ingredients"
    omop_record: "DrugStrength.ingredientConcept"
    concepts_define: "Insulin Ingredient Concepts"
    concepts:
      - concept_id: 1567198
        name:       "insulin aspart, human"
      - concept_id: 1531601
        name:       "insulin aspart protamine, human"
        vocabulary: "RxNorm"
      - concept_id: 35602717
        name:       "insulin degludec"
      - concept_id: 1516976
        name:       "insulin detemir"
      - concept_id: 1502905
        name:       "insulin glargine"
      - concept_id: 1544838
        name:       "insulin glulisine, human"
      - concept_id: 1596977
        name:       "insulin, regular, human"
      - concept_id: 46221581
        name:       "insulin isophane"
      - concept_id: 19090244
        name:       "insulin, prompt zinc, beef"
        vocabulary: "RxNorm"
      - concept_id: 1550023
        name:       "insulin lispro"
